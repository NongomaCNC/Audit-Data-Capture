<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Field Data Capture</title>

    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        /* ---------- BASIC LAYOUT ---------- */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 1rem;
            background: #f2f2f2;
            color: #333;
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
            line-height: 1.6; /* Improve readability */
        }
        h1 {
            text-align: center;
            color: #333;
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
        }

        form {
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: grid;
            gap: 1rem;
            grid-template-columns: 1fr;
            max-width: 900px;
            margin: auto;
            margin-bottom: 2rem; /* Add space below form */
        }
        /* Adjust for smaller mobile screens before 600px breakpoint */
        @media (max-width: 599px) {
            form {
                padding: 0.8rem;
                gap: 0.8rem;
            }
            .field label {
                font-size: 0.95rem;
            }
            input, select, textarea {
                font-size: 0.9rem;
                padding: 0.4rem;
            }
            button {
                padding: 0.6rem 0.8rem;
                font-size: 0.9rem;
            }
        }
        @media (min-width: 600px) {
            form {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ---------- FORM ELEMENTS ---------- */
        .field {
            display: flex;
            flex-direction: column;
            margin-bottom: 0.5rem; /* Space between fields */
        }
        label {
            margin-bottom: 0.3rem;
            font-weight: bold;
            color: #555; /* Slightly softer label color */
        }
        input, select, textarea {
            padding: 0.6rem; /* Slightly more padding */
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            width: 100%; /* Ensure inputs take full width */
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 0.15rem rgba(0, 123, 255, 0.25);
        }
        textarea {
            min-height: 70px; /* Slightly taller textarea */
            resize: vertical;
        }

        /* Style for readonly GPS inputs */
        input[readonly] {
            background-color: #e9e9e9;
            cursor: not-allowed;
            color: #666; /* Make readonly text a bit lighter */
        }

        /* Highlight required fields */
        label span.required {
            color: red;
            font-weight: normal;
            margin-left: 0.2rem;
        }

        /* ---------- BUTTONS ---------- */
        .actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center; /* Center buttons */
            margin-top: 1.5rem; /* More space above buttons */
        }
        button {
            flex: 1 1 auto; /* Allow buttons to grow and shrink */
            min-width: 140px; /* Minimum width for buttons */
            max-width: 200px; /* Max width to prevent overly wide buttons on larger screens */
            border: none;
            border-radius: 5px;
            color: #fff;
            padding: 0.8rem 1.2rem; /* Slightly more padding */
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            font-weight: bold; /* Make button text bolder */
        }
        button:hover {
            opacity: 0.95;
            transform: translateY(-2px); /* More pronounced hover effect */
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); /* Stronger shadow on hover */
        }
        button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        #gpsBtn { background: #28a745; } /* Green */
        #exportBtn { background: #ffc107; color: #000; } /* Amber/Yellow */
        #submitBtn { background: #007bff; } /* Blue */
        #syncBtn { background: #6c757d; } /* Grey */
        #viewDataBtn { background: #17a2b8; } /* Teal */
        #clearDataBtn { background: #dc3545; } /* Red */
        .editBtn { background: #007bff; font-size: 0.85rem; padding: 0.5rem 0.8rem; margin-right: 8px; }
        .deleteBtn { background: #dc3545; font-size: 0.85rem; padding: 0.5rem 0.8rem; }
        .editBtn:hover, .deleteBtn:hover {
            transform: none; /* Keep smaller buttons from moving too much */
            box-shadow: none;
        }


        /* ---------- MESSAGES ---------- */
        #message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 12px 25px; /* More padding */
            border-radius: 5px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease-in-out, background-color 0.3s ease; /* Smooth transitions */
            pointer-events: none; /* Allow clicks to pass through */
            text-align: center;
            white-space: nowrap;
            font-size: 0.95rem; /* Slightly larger font */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); /* Add shadow */
        }
        #message.show {
            opacity: 1;
        }
        #message.error { background-color: #dc3545 !important; }
        #message.success { background-color: #28a745 !important; }
        #message.info { background-color: #17a2b8 !important; } /* Use teal for info */


        /* ---------- SAVED DATA SECTION ---------- */
        #savedDataSection {
            background: #fff;
            padding: 1.5rem; /* More padding */
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
            max-width: 900px;
            margin: auto;
            margin-top: 2rem;
            display: none; /* Hidden by default */
        }
        #savedDataSection.visible {
            display: block;
        }
        #savedDataSection h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 1.5rem; /* More space below heading */
        }
        #savedDataTableContainer {
            overflow-x: auto; /* Enable horizontal scrolling for tables on small screens */
            max-width: 100%; /* Ensure container respects parent width */
            border: 1px solid #e0e0e0; /* Subtle border around table container */
            border-radius: 5px;
        }
        #savedDataTable {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0; /* Remove margin, handled by container */
        }
        #savedDataTable th, #savedDataTable td {
            border: 1px solid #eee; /* Lighter border for cells */
            padding: 10px; /* More padding in cells */
            text-align: left;
            white-space: nowrap; /* Prevent text wrapping in table cells */
        }
        #savedDataTable th {
            background-color: #f8f8f8; /* Lighter header background */
            font-weight: bold;
            position: sticky; /* Make headers sticky for horizontal scroll */
            top: 0; /* Important for sticky header */
            left: 0;
            z-index: 1;
            color: #444;
        }
        #savedDataTable tbody td:first-child,
        #savedDataTable tbody th:first-child {
            left: 0;
            position: sticky;
            background-color: inherit; /* Ensure background matches row */
            z-index: 0; /* Below header */
        }
        #savedDataTable tr:nth-child(even) {
            background-color: #fefefe; /* Slightly whiter even rows */
        }
        #savedDataTable tr:hover {
            background-color: #f5f5f5; /* More visible hover */
        }
        #savedDataActions {
            text-align: center;
            margin-top: 1.5rem; /* More space above actions */
            display: flex;
            justify-content: center;
            gap: 1.5rem; /* More gap */
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <h1>Field Data Capture</h1>

    <form id="captureForm">
        <input type="hidden" id="recordId" name="id" value="">

        <div class="field"><label for="workorderNo">Workorder No</label><input id="workorderNo" name="workorderNo" type="text" placeholder="Optional"></div>
        <div class="field"><label for="zone">Zone</label><input id="zone" name="zone" type="text" placeholder="e.g., North"></div>
        <div class="field"><label for="sector">Sector</label><input id="sector" name="sector" type="text" placeholder="e.g., A"></div>
        <div class="field"><label for="cnc">CNC</label><input id="cnc" name="cnc" type="text"></div>
        <div class="field"><label for="contractorName">Contractor Name or Source</label><input id="contractorName" name="contractorName" type="text"></div>
        <div class="field"><label for="date">Date <span class="required">*</span></label><input id="date" type="date" name="date" required></div>
        <div class="field"><label for="feederName">Feeder Name</label><input id="feederName" name="feederName" type="text"></div>

        <div class="field"><label for="longitude">Longitude (DD MM SS.SSS E/W)</label><input id="lon" name="longitude" type="text" readonly></div>

        <div class="field"><label for="atHome">At Home</label><select id="atHome" name="atHome"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label for="connected">Connected</label><select id="connected" name="connected"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label for="abandoned">Abandoned</label><select id="abandoned" name="abandoned"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label for="vandalised">Vandalised</label><select id="vandalised" name="vandalised"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label for="illegal">Illegal</label><select id="illegal" name="illegal"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label for="owner">Owner</label><select id="owner" name="owner"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>

        <div class="field"><label for="surname">Surname</label><input id="surname" name="surname" type="text"></div>

        <div class="field"><label for="phoneCode">Phone Code</label><input id="phoneCode" name="phoneCode" type="tel" inputmode="numeric" pattern="[0-9]*" placeholder="e.g., +27"></div>
        <div class="field"><label for="phoneNo">Phone No</label><input id="phoneNo" name="phoneNo" type="tel" inputmode="tel" placeholder="e.g., 821234567"></div>

        <div class="field"><label for="recentVendor">Most Recent Vendor</label><input id="recentVendor" name="recentVendor" type="text"></div>
        <div class="field"><label for="meterNo">Meter No</label><input id="meterNo" name="meterNo" type="text"></div>
        <div class="field"><label for="split">Split</label><select id="split" name="split"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>
        <div class="field"><label for="commonBaseMeter">Common/Non Common Base Meter</label><input id="commonBaseMeter" name="commonBaseMeter" type="text"></div>
        <div class="field"><label for="edEcu">ED/ECU</label><input id="edEcu" name="edEcu" type="text"></div>
        <div class="field"><label for="meterType">Meter Type</label><input id="meterType" name="meterType" type="text"></div>
        <div class="field"><label for="tariffCode">Tariff Code</label><input id="tariffCode" name="tariffCode" type="text"></div>
        <div class="field"><label for="ampLimit">Amp Limit</label><input id="ampLimit" name="ampLimit" type="number" inputmode="numeric" pattern="[0-9]*"></div>

        <div class="field"><label for="stsOrProp">STS or Prop</label><input id="stsOrProp" name="stsOrProp" type="text"></div>

        <div class="field"><label for="removed">Removed</label><select id="removed" name="removed"><option value="">— Select —</option><option value="Yes">Yes</option><option value="No">No</option></select></div>

        <div class="field"><label for="newMeterCardTrip">New Meter Card Trip</label><select id="newMeterCardTrip" name="newMeterCardTrip"><option value="">— Select —</option><option value="Pass">Pass</option><option value="Fail">Fail</option></select></div>

        <div class="actions">

            <button type="button" id="viewDataBtn">View Data</button>

    </form>

    <div id="message" role="alert" aria-live="polite"></div>

    <div id="savedDataSection">
        <h2>Saved Field Entries</h2>
        <div id="savedDataTableContainer">
            <table id="savedDataTable">
                <thead>
                    <tr id="savedTableHeader"></tr>
                </thead>
                <tbody id="savedTableBody"></tbody>
            </table>
        </div>
        <div id="savedDataActions">
            <button type="button" id="clearDataBtn">Clear All Saved Data</button>
            <button type="button" id="closeViewDataBtn">Close View</button>
        </div>
    </div>


    <script>
        const DB_NAME = 'FieldDataDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'records';

        let db;
        let currentEditingRecordId = null; // To keep track of the record being edited

        // --- IndexedDB Functions ---
        /**
         * Initializes the IndexedDB database.
         * @returns {Promise<IDBDatabase>} A promise that resolves with the database instance.
         */
        async function initDb() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (event) => {
                    const dbInstance = event.target.result;
                    if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
                        dbInstance.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };

                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };

                request.onerror = (event) => {
                    console.error('IndexedDB error:', event.target.error);
                    showMessage(`Database error: ${event.target.error.message}`, 'error');
                    reject(event.target.error);
                };
            });
        }

        /**
         * Performs a transaction on the IndexedDB.
         * @param {string} storeName The name of the object store.
         * @param {string} mode The transaction mode ('readonly' or 'readwrite').
         * @param {function(IDBObjectStore): IDBRequest} operation A function that performs the desired operation on the store.
         * @returns {Promise<any>} A promise that resolves with the result of the operation.
         */
        function transactDb(storeName, mode, operation) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('IndexedDB not initialized.'));
                    return;
                }
                const transaction = db.transaction([storeName], mode);
                const store = transaction.objectStore(storeName);

                const request = operation(store);

                request.onsuccess = () => resolve(request.result);
                request.onerror = (event) => reject(event.target.error);
            });
        }

        /**
         * Adds a record to IndexedDB.
         * @param {object} record The record to add.
         * @returns {Promise<void>}
         */
        async function addRecord(record) {
            try {
                await transactDb(STORE_NAME, 'readwrite', (store) => store.add(record));
            } catch (error) {
                console.error('Add record error:', error);
                showMessage('Error saving data.', 'error');
                throw error; // Re-throw to be caught by caller
            }
        }

        /**
         * Updates a record in IndexedDB.
         * @param {object} record The record to update.
         * @returns {Promise<void>}
         */
        async function updateRecord(record) {
            try {
                await transactDb(STORE_NAME, 'readwrite', (store) => store.put(record));
            } catch (error) {
                console.error('Update record error:', error);
                showMessage('Error updating data.', 'error');
                throw error;
            }
        }

        /**
         * Deletes a record from IndexedDB.
         * @param {number} id The ID of the record to delete.
         * @returns {Promise<void>}
         */
        async function deleteRecord(id) {
            try {
                await transactDb(STORE_NAME, 'readwrite', (store) => store.delete(id));
            } catch (error) {
                console.error('Delete record error:', error);
                showMessage('Error deleting data.', 'error');
                throw error;
            }
        }

        /**
         * Gets all records from IndexedDB.
         * @returns {Promise<Array<object>>} A promise that resolves with an array of records.
         */
        async function getAllRecords() {
            try {
                return await transactDb(STORE_NAME, 'readonly', (store) => store.getAll());
            } catch (error) {
                console.error('Get all records error:', error);
                showMessage('Error retrieving data for display/export.', 'error');
                throw error;
            }
        }

        /**
         * Gets a single record by ID from IndexedDB.
         * @param {number} id The ID of the record to retrieve.
         * @returns {Promise<object|undefined>} A promise that resolves with the record, or undefined if not found.
         */
        async function getRecordById(id) {
            try {
                return await transactDb(STORE_NAME, 'readonly', (store) => store.get(id));
            } catch (error) {
                console.error('Get record by ID error:', error);
                showMessage('Error retrieving record for editing.', 'error');
                throw error;
            }
        }

        /**
         * Clears all records from IndexedDB.
         * @returns {Promise<void>}
         */
        async function clearAllRecords() {
            try {
                await transactDb(STORE_NAME, 'readwrite', (store) => store.clear());
            } catch (error) {
                console.error('Clear records error:', error);
                showMessage('Error clearing data.', 'error');
                throw error;
            }
        }

        // --- UI Feedback Message ---
        const messageElement = document.getElementById('message');
        let messageTimeout;

        /**
         * Displays a temporary message to the user.
         * @param {string} msg The message to display.
         * @param {'info' | 'success' | 'error'} type The type of message (determines color).
         * @param {number} duration The duration in milliseconds for the message to display.
         */
        function showMessage(msg, type = 'info', duration = 3000) {
            clearTimeout(messageTimeout); // Clear any existing timeout
            messageElement.textContent = msg;
            messageElement.className = `show ${type}`; // Apply show and type classes

            messageTimeout = setTimeout(() => {
                messageElement.classList.remove('show');
            }, duration);
        }

        /* --- Decimal Degrees to DD MM SS.SSS with Hemisphere --- */
        /**
         * Converts decimal degrees to Degrees Minutes Seconds (DMS) format with hemisphere.
         * @param {number} dec The decimal degree value.
         * @param {'latitude' | 'longitude'} type The type of coordinate (latitude or longitude).
         * @returns {string} The formatted DMS string.
         */
        function toDMS(dec, type) {
            if (dec === null || dec === undefined || isNaN(dec)) return '';

            const abs = Math.abs(dec);
            const deg = Math.floor(abs);
            const minF = (abs - deg) * 60;
            const min = Math.floor(minF);
            const sec = ((minF - min) * 60).toFixed(3);

            let hemisphere = '';
            if (type === 'latitude') {
                hemisphere = dec >= 0 ? 'N' : 'S';
            } else if (type === 'longitude') {
                hemisphere = dec >= 0 ? 'E' : 'W';
            }

            return `${String(deg).padStart(2, '0')} ${String(min).padStart(2, '0')} ${sec.padStart(6, '0')} ${hemisphere}`;
        }

        /* --- Reset Form Function --- */
        function resetFormAndGPS() {
            const form = document.getElementById('captureForm');
            form.reset();
            document.getElementById('recordId').value = ''; // Clear the hidden ID

            // Set current date
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;

            // Only clear GPS fields if they are currently populated or if we are not actively getting GPS
            // This prevents clearing during a long GPS acquisition process if a user resets the form
            // For now, simpler: always clear, as GPS will re-acquire on next 'Get GPS' or auto-on-load.
            document.getElementById('lat').value = '';
            document.getElementById('lon').value = '';

            currentEditingRecordId = null; // Reset editing state
            document.getElementById('submitBtn').textContent = 'Save Data'; // Change button back to Save
        }

        /* --- Auto-GPS on load (mobile friendly) --- */
        window.addEventListener('load', async () => {
            // Register Service Worker
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('service-worker.js');
                    console.log('Service Worker Registered', registration);
                } catch (error) {
                    console.error('Service Worker Registration Failed:', error);
                    showMessage('Service Worker registration failed. Offline features may be limited.', 'error');
                }
            } else {
                console.warn('Service Workers are not supported in this browser.');
                showMessage('Your browser does not support offline features.', 'error', 5000);
            }

            // Initialize DB and then get GPS
            try {
                await initDb();
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            document.getElementById('lat').value = toDMS(pos.coords.latitude, 'latitude');
                            document.getElementById('lon').value = toDMS(pos.coords.longitude, 'longitude');
                            showMessage('Initial GPS acquired.', 'success', 2000);
                        },
                        err => {
                            console.warn('Auto GPS error:', err.message);
                            showMessage('Could not get initial GPS. Tap "Get GPS" if needed.', 'info', 4000);
                        },
                        // High accuracy, low timeout for initial grab, allows cache usage (maximumAge)
                        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
                    );
                } else {
                    showMessage('Geolocation not supported by your browser.', 'error');
                }
            } catch (e) {
                showMessage('Failed to initialize local database. Please check console.', 'error');
            }

            // Set current date on load and reset form
            resetFormAndGPS();
        });

        /* --- GPS BUTTON --- */
        document.getElementById('gpsBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                showMessage('Geolocation not supported by your browser.', 'error');
                return;
            }
            showMessage('Getting GPS...', 'info', 10000); // Increased timeout message
            navigator.geolocation.getCurrentPosition(
                pos => {
                    document.getElementById('lat').value = toDMS(pos.coords.latitude, 'latitude');
                    document.getElementById('lon').value = toDMS(pos.coords.longitude, 'longitude');
                    showMessage('GPS acquired successfully!', 'success');
                },
                err => {
                    let errorMessage = `GPS Error: ${err.message}.`;
                    if (err.code === err.PERMISSION_DENIED) {
                        errorMessage += ' Please enable location permissions for this site.';
                    } else if (err.code === err.TIMEOUT) {
                        errorMessage += ' Timeout: Could not get a location quickly enough.';
                    }
                    showMessage(errorMessage, 'error');
                    console.error('GPS Error:', err);
                },
                { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 } // Request fresh position with longer timeout
            );
        });

        /* --- FORM SUBMIT --- */
        document.getElementById('captureForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const data = {};
            for (let [key, value] of formData.entries()) {
                data[key] = value.trim(); // Trim whitespace from all inputs
            }

            // Client-side validation
            if (!data.transformerNo) {
                showMessage('Transformer Number is mandatory.', 'error');
                document.getElementById('transformerNo').focus();
                return;
            }
            if (!data.date) {
                showMessage('Date is mandatory.', 'error');
                document.getElementById('date').focus();
                return;
            }

            // Format date to YYYY/MM/DD for consistent storage
            if (data.date) {
                try {
                    const d = new Date(data.date);
                    if (!isNaN(d.getTime())) { // Check if date is valid
                        data.date = d.toISOString().split('T')[0].replace(/-/g, '/'); // YYYY/MM/DD
                    } else {
                        data.date = ''; // Clear invalid date
                        showMessage('Invalid date entered. Please use a valid date.', 'error');
                        return;
                    }
                } catch (error) {
                    console.error("Date formatting error:", error);
                    data.date = '';
                }
            }

            // Convert number fields explicitly, handle empty strings or non-numeric input gracefully
            data.ampLimit = data.ampLimit ? parseFloat(data.ampLimit) : null; // Use null for empty number fields
            data.newMeterAmpLimit = data.newMeterAmpLimit ? parseFloat(data.newMeterAmpLimit) : null;
            
            // Handle ID as number for IndexedDB key, crucial for update operations
            if (data.id) {
                data.id = parseInt(data.id, 10);
                if (isNaN(data.id)) {
                    console.error("Invalid ID for update:", data.id);
                    showMessage('Error: Invalid record ID for update.', 'error');
                    return;
                }
            } else {
                delete data.id; // Ensure 'id' is not present for new records so autoIncrement works
            }

            try {
                if (currentEditingRecordId !== null && data.id === currentEditingRecordId) {
                    // Update existing record
                    await updateRecord(data);
                    showMessage('Data updated successfully offline ✔', 'success');
                } else {
                    // Add new record
                    await addRecord(data);
                    showMessage('Data saved successfully offline ✔', 'success');
                }
                resetFormAndGPS(); // Reset form and GPS fields after successful operation
            } catch (error) {
                // Error messages are already shown by the IndexedDB functions, just log here.
                console.error('Form submission failed:', error);
            }
        });

        /* --- Header mapping for Excel and Table Display --- */
        // Expanded map for all fields
        const map = {
            workorderNo: "Workorder No", zone: "Zone", sector: "Sector", cnc: "CNC",
            contractorName: "Contractor Name", date: "Date", feederName: "Feeder Name",
            townshipName: "Township Name", transformerNo: "Transformer No", standNo: "Stand No",
            installationNo: "Installation No", latitude: "Latitude", longitude: "Longitude",
            access: "Access", atHome: "At Home", connected: "Connected", abandoned: "Abandoned",
            vandalised: "Vandalised", illegal: "Illegal", owner: "Owner", surname: "Surname",
            name: "Name", idNo: "ID No", phoneCode: "Phone Code", phoneNo: "Phone No",
            normalVendor: "Normal Vendor", recentVendor: "Most Recent Vendor", meterNo: "Meter No",
            split: "Split", commonBaseMeter: "Common/Non Common Base Meter", edEcu: "ED/ECU",
            meterType: "Meter Type", tariffCode: "Tariff Code", ampLimit: "Amp Limit",
            supplyGroupCode: "Supply Group Code", magCard: "Mag Card/Keypad", stsOrProp: "STS or Prop",
            tampered: "Tampered", tamperMethod: "Tamper Method", removed: "Removed",
            tamperNotNo: "Tamper Not No", cardTrip: "Card Trip", elTest: "E/L Test",
            meterFaulty: "Meter Faulty", replaced: "Replaced", mmfNo: "MMF No",
            newMeterNo: "New Meter No", newMeterType: "New Meter Type",
            newMeterAmpLimit: "New Meter Amp Limit", newMeterCardTrip: "New Meter Card Trip",
            newMeterElTest: "New Meter E/L Test", sealed: "Sealed", sealNo: "Seal No",
            remarks: "Remarks"
        };

        /* --- Explicit order of fields for table display/Excel for consistency --- */
        const fieldOrder = [
            "workorderNo", "zone", "sector", "cnc", "contractorName", "date",
            "feederName", "townshipName", "transformerNo", "standNo",
            "installationNo", "latitude", "longitude", "access", "atHome",
            "connected", "abandoned", "vandalised", "illegal", "owner",
            "surname", "name", "idNo", "phoneCode", "phoneNo",
            "normalVendor", "recentVendor", "meterNo", "split", "commonBaseMeter",
            "edEcu", "meterType", "tariffCode", "ampLimit", "supplyGroupCode",
            "magCard", "stsOrProp", "tampered", "tamperMethod", "removed",
            "tamperNotNo", "cardTrip", "elTest", "meterFaulty", "replaced",
            "mmfNo", "newMeterNo", "newMeterType", "newMeterAmpLimit",
            "newMeterCardTrip", "newMeterElTest", "sealed", "sealNo", "remarks"
        ];


        /* --- EXCEL EXPORT --- */
        document.getElementById('exportBtn').addEventListener('click', async () => {
            try {
                const recordsToExport = await getAllRecords();

                if (recordsToExport.length === 0) {
                    showMessage('No data to export.', 'info');
                    return;
                }

                /* Transform records using the explicit fieldOrder for consistent column order in Excel */
                const formatted = recordsToExport.map(rec => {
                    const obj = {};
                    fieldOrder.forEach(key => {
                        // Use the map for header names, default to key if not found
                        // Ensure numerical fields that are null are exported as empty strings, not "null"
                        let value = rec[key];
                        if (typeof value === 'number' && value === null) {
                            value = '';
                        }
                        obj[map[key] || key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())] = value || '';
                    });
                    return obj;
                });

                /* Export using SheetJS */
                const ws = XLSX.utils.json_to_sheet(formatted);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'FieldData');
                const timestamp = new Date().toISOString().replace(/[:.-]/g, '');
                XLSX.writeFile(wb, `Field_Data_${timestamp}.xlsx`);
                showMessage('Data exported to Excel successfully!', 'success');
            } catch (error) {
                // Error message already shown by getAllRecords or console.error by XLSX.writeFile
                console.error('Error during Excel export:', error);
                showMessage('Error exporting data to Excel.', 'error');
            }
        });

        /* --- SYNC DATA (Placeholder) --- */
        document.getElementById('syncBtn').addEventListener('click', async () => {
            showMessage('Sync functionality is under development.', 'info', 3000);
            // Enhanced Sync Logic (Conceptual):
            /*
            try {
                const recordsToSync = await getAllRecords(); // Or get only unsynced records
                if (recordsToSync.length === 0) {
                    showMessage('No data to sync.', 'info');
                    return;
                }

                showMessage('Attempting to sync data...', 'info', 0); // Indefinite message

                const response = await fetch('/api/sync-data', { // Replace with your actual API endpoint
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(recordsToSync)
                });

                if (response.ok) {
                    const result = await response.json();
                    // Assuming your backend returns IDs of successfully synced records
                    // You might then update a 'synced' flag in IndexedDB for these records
                    // For example: for (const syncedId of result.syncedIds) { await updateRecord({ id: syncedId, synced: true }); }
                    showMessage('Data synced successfully to server!', 'success');
                    // Optionally refresh the table if a 'synced' status is displayed
                    // document.getElementById('viewDataBtn').click();
                } else {
                    const errorData = await response.json();
                    showMessage(`Sync failed: ${errorData.message || response.statusText}`, 'error', 5000);
                }
            } catch (error) {
                console.error('Sync failed:', error);
                showMessage('Network error or server unreachable. Sync failed.', 'error', 5000);
            }
            */
        });

        /* --- VIEW SAVED DATA & EDIT --- */
        const savedDataSection = document.getElementById('savedDataSection');
        const savedTableHeader = document.getElementById('savedTableHeader');
        const savedTableBody = document.getElementById('savedTableBody');
        const captureForm = document.getElementById('captureForm');


        /**
         * Populates the form with a given record's data for editing.
         * @param {object} record The record object to load into the form.
         */
        function populateFormForEdit(record) {
            Array.from(captureForm.elements).forEach(element => {
                // Ensure element has a name and the record has a corresponding property
                if (element.name && record.hasOwnProperty(element.name)) {
                    let value = record[element.name];

                    if (element.type === 'date') {
                        // Convert YYYY/MM/DD (from IndexedDB) to YYYY-MM-DD (for input type="date")
                        if (typeof value === 'string' && value.includes('/')) {
                            value = value.replace(/\//g, '-');
                        }
                        element.value = value || '';
                    } else if (element.tagName === 'SELECT') {
                        // Directly set value for select elements
                        element.value = value || '';
                    } else if (element.type === 'number') {
                        // Ensure number inputs receive valid numbers or empty string
                        element.value = (value !== null && value !== undefined && !isNaN(parseFloat(value))) ? parseFloat(value) : '';
                    }
                    else if (element.type === 'radio' || element.type === 'checkbox') {
                        // Handle radio/checkbox (though not present in this form, good practice)
                        element.checked = (element.value === value);
                    } else {
                        // For all other text/textarea inputs
                        element.value = value || '';
                    }
                }
            });

            // Set the hidden ID and update editing state
            document.getElementById('recordId').value = record.id;
            currentEditingRecordId = record.id;
            document.getElementById('submitBtn').textContent = 'Update Data';

            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll to top
            showMessage('Data loaded for editing.', 'info');
            savedDataSection.classList.remove('visible'); // Hide the table view after editing
        }


        document.getElementById('viewDataBtn').addEventListener('click', async () => {
            // Toggle view visibility
            if (savedDataSection.classList.contains('visible')) {
                savedDataSection.classList.remove('visible');
                showMessage('Data view closed.', 'info', 2000);
                return;
            }

            try {
                const records = await getAllRecords();
                if (records.length === 0) {
                    showMessage('No saved data to display.', 'info');
                    return;
                }

                // Clear previous table content
                savedTableHeader.innerHTML = '';
                savedTableBody.innerHTML = '';

                // Create table headers based on the fieldOrder and map, plus an 'Actions' column
                const headerRow = document.createElement('tr');
                fieldOrder.forEach(key => {
                    const th = document.createElement('th');
                    th.textContent = map[key] || key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
                    headerRow.appendChild(th);
                });
                const actionsTh = document.createElement('th');
                actionsTh.textContent = 'Actions';
                headerRow.appendChild(actionsTh);
                savedTableHeader.appendChild(headerRow);

                // Populate table body with data and Add Edit/Delete Buttons
                const fragment = document.createDocumentFragment(); // Use fragment for performance
                records.forEach(record => {
                    const row = document.createElement('tr');
                    fieldOrder.forEach(key => {
                        const td = document.createElement('td');
                        td.textContent = record[key] || ''; // Display empty string for null/undefined values
                        row.appendChild(td);
                    });

                    const actionsTd = document.createElement('td');

                    const editButton = document.createElement('button');
                    editButton.textContent = 'Edit';
                    editButton.classList.add('editBtn');
                    editButton.dataset.recordId = record.id; // Store ID as data attribute
                    actionsTd.appendChild(editButton);

                    const deleteButton = document.createElement('button');
                    deleteButton.textContent = 'Delete';
                    deleteButton.classList.add('deleteBtn');
                    deleteButton.dataset.recordId = record.id; // Store ID as data attribute
                    actionsTd.appendChild(deleteButton);

                    row.appendChild(actionsTd);
                    fragment.appendChild(row);
                });
                savedTableBody.appendChild(fragment); // Append fragment to the DOM once

                savedDataSection.classList.add('visible');
                showMessage('Displaying saved data.', 'success', 2000);

            } catch (error) {
                // Error message already shown by getAllRecords
                console.error("Error displaying records:", error);
            }
        });

        // Event listener for the "Edit" and "Delete" buttons (delegated to the table body)
        savedTableBody.addEventListener('click', async (event) => {
            // Use event delegation to handle clicks on dynamically created buttons
            const target = event.target;

            if (target.classList.contains('editBtn')) {
                const recordId = parseInt(target.dataset.recordId, 10);
                if (isNaN(recordId)) {
                    showMessage('Invalid record ID for editing.', 'error');
                    return;
                }
                try {
                    const recordToEdit = await getRecordById(recordId);
                    if (recordToEdit) {
                        populateFormForEdit(recordToEdit);
                    } else {
                        showMessage('Record not found for editing.', 'error');
                    }
                } catch (error) {
                    console.error('Error loading record for editing:', error);
                    // Message already shown by getRecordById
                }
            } else if (target.classList.contains('deleteBtn')) {
                const recordId = parseInt(target.dataset.recordId, 10);
                if (isNaN(recordId)) {
                    showMessage('Invalid record ID for deletion.', 'error');
                    return;
                }
                if (confirm('Are you sure you want to delete this record? This cannot be undone.')) {
                    try {
                        await deleteRecord(recordId);
                        showMessage('Record deleted successfully.', 'success');
                        // Re-display data after deletion for immediate feedback
                        document.getElementById('viewDataBtn').click();
                    } catch (error) {
                        console.error('Error deleting record:', error);
                        // Message already shown by deleteRecord
                    }
                }
            }
        });


        document.getElementById('closeViewDataBtn').addEventListener('click', () => {
            savedDataSection.classList.remove('visible');
            showMessage('Data view closed.', 'info', 2000);
        });

        document.getElementById('clearDataBtn').addEventListener('click', async () => {
            if (confirm('Are you sure you want to clear ALL saved data? This action cannot be undone.')) {
                try {
                    await clearAllRecords();
                    showMessage('All saved data cleared successfully.', 'success');
                    // Hide the table and refresh view
                    savedDataSection.classList.remove('visible');
                    savedTableBody.innerHTML = ''; // Clear table body
                    savedTableHeader.innerHTML = ''; // Clear table header
                } catch (error) {
                    console.error("Error clearing data:", error);
                    // Message already shown by clearAllRecords
                }
            }
        });
    </script>
</body>
